
name: Flutter Android - Firebase Distribution

on:
  push:
    branches:
      - 'feature/record_injuries'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-distribute:
    name: Build APK and distribute
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mobile/lesiones_cutaneas

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check Flutter installation
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Restore stable Android debug keystore
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_DEBUG_KEYSTORE_BASE64" ]; then
            echo "Missing ANDROID_DEBUG_KEYSTORE_BASE64 secret"
            exit 1
          fi

          mkdir -p "$HOME/.android"
          echo "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"

      - name: Build Android APK
        run: flutter build apk --debug

      - name: Upload APK to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: flutter-android-apk
          path: mobile/lesiones_cutaneas/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Distribute APK to Firebase
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          groups: testers
          file: mobile/lesiones_cutaneas/build/app/outputs/flutter-apk/app-debug.apk
          releaseNotes: 'Actualizacion automatica desde feature/record_injuries'
